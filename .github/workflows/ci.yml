name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Lint workflows
    uses: ScottKirvan/.github/.github/workflows/reusable-actionlint.yml@main

  check:
    name: Typecheck, build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Unit and build tests
        run: npm test

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Acceptance tests
        run: npm run test:e2e
